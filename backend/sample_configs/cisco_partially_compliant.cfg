!
version 15.7
hostname Midsize-Edge-77
!
aaa new-model
aaa authentication login default local
!
service password-encryption
enable secret 9 $9$m0Q8Fm671$hX
!
username netadmin privilege 15 secret 9 $9$kL00Pz$Z1
!
login block-for 120 attempts 5 within 60
!
no ip http server
ip http secure-server
!
ip ssh version 2
crypto key generate rsa modulus 3072
!
no ip source-route
no service finger
!
service timestamps log datetime msec
logging buffered 64000
logging host 10.20.30.100
logging trap informational
!
snmp-server community public ro
snmp-server community nmsview ro SEC-MGMT
!
ip access-list standard SEC-MGMT
 permit 10.20.50.0 0.0.0.255
 deny any
!
interface GigabitEthernet0/0
 description WAN
 ip address 203.0.113.10 255.255.255.252
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.20.10.1 255.255.255.0
!
line con 0
 exec-timeout 10 0
!
line vty 0 4
 exec-timeout 6 0
 transport input ssh
!
line vty 5 15
 exec-timeout 6 0
 transport input telnet ssh
!
end