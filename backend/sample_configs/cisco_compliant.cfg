!
version 15.6
hostname Core-Router-01
!
aaa new-model
aaa authentication login default local
!
service password-encryption
enable secret 9 $9$m0Q8Fm671$hX
!
username sysadmin privilege 15 secret 9 $9$a89KlOp0$zY
!
login block-for 180 attempts 3 within 60
!
no ip http server
ip http secure-server
!
ip ssh version 2
crypto key generate rsa modulus 4096
!
no ip source-route
no service finger
no service tcp-small-servers
no cdp run
!
service timestamps log datetime msec
logging buffered 64000
logging host 10.10.50.100
logging trap informational
!
snmp-server group SECGROUP v3 priv
snmp-server user secadmin SECGROUP v3 auth sha StrongAuth987! priv aes 128 StrongPriv654!
snmp-server contact netops@agency.gov.in
snmp-server location DataCenter-Rack-4A
!
ip access-list standard MGMT-HOSTS
 permit 10.10.50.0 0.0.0.255
 deny any
!
interface GigabitEthernet0/0
 description WAN-Uplink
 ip address 203.0.113.1 255.255.255.252
 no cdp enable
!
interface GigabitEthernet0/1
 description LAN-Inside
 ip address 10.10.10.1 255.255.255.0
!
line con 0
 exec-timeout 10 0
!
line vty 0 4
 access-class MGMT-HOSTS in
 exec-timeout 5 0
 transport input ssh
!
line vty 5 15
 access-class MGMT-HOSTS in
 exec-timeout 5 0
 transport input ssh
!
end
