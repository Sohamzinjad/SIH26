# FortiGate Mid-Size Config (partially hardened)
config system global
    set hostname "Branch-FW-42"
    set admintimeout 12
    set admin-ssh enable
    set admin-telnet disable
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.5 255.255.255.0
        set allowaccess ping https ssh
    next
    edit "port2"
        set vdom "root"
        set ip 10.40.0.1 255.255.255.0
        set allowaccess ping ssh
    next
    edit "port3"
        set vdom "root"
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping http
    next
end

config log syslogd setting
    set status enable
    set server "10.40.0.100"
end

config system snmp community
    edit 1
        set name "public"
        set status enable
    next
end