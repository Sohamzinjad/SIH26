version 15.2
hostname spoofing-bypass-neg
enable secret 5 $1$II$9abcdefghijklmnopqrstuv
service password-encryption
aaa new-model
username netadmin privilege 15 secret 5 $1$JJ$abcdefghijklmnopqrstuv
ip ssh version 2
no ip http server
logging host 10.10.10.10
logging trap informational
logging buffered 64000
service timestamps log datetime msec
no ip source-route
no service finger
login block-for 180 attempts 3 within 60
line con 0
 exec-timeout 10 0
line vty 0 4
 transport input ssh
 exec-timeout 10 0
!
end